<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Website</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#f5f0e6;color:#1b1b1b;}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
background:#3b2f2f;
color:#fff;
position:sticky;
top:0;
z-index:1000;
}
.logo{font-size:22px;font-weight:bold;color:#f5f0e6;}
.menu i{font-size:24px;cursor:pointer;}

/* MENU */
.nav{
position:absolute;
top:60px;
right:20px;
background:#3b2f2f;
padding:10px;
display:none;
flex-direction:column;
border-radius:10px;
}
.nav a{
color:#fff;
padding:10px;
text-decoration:none;
}
.nav a:hover{background:#5a3d2b;}

/* HERO */
.hero{position:relative;height:80vh;overflow:hidden;}
.slide{
position:absolute;width:100%;height:100%;
opacity:0;transition:1s;
background-size:cover;background-position:center;
}
.slide.active{opacity:1;}
.hero-text{
position:absolute;bottom:60px;left:40px;
color:#fff;background:rgba(0,0,0,0.4);
padding:20px;border-radius:10px;
}

/* COUNTERS */
.stats{
display:flex;justify-content:space-around;
padding:40px;background:#e6d5b8;text-align:center;
}
.stat h2{font-size:30px;color:#3b2f2f;}

/* BOOKING */
.booking{
padding:40px;background:#fff;
text-align:center;
}
.booking-card{
max-width:450px;margin:auto;
background:#f5f0e6;
padding:25px;border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}
.booking-card input,
.booking-card select,
textarea{
width:100%;padding:12px;margin:10px 0;
border:1px solid #ccc;border-radius:8px;
}
.booking-card button{
width:100%;padding:12px;
background:#3b2f2f;color:#fff;
border:none;border-radius:8px;
cursor:pointer;
}
#msg{margin-top:10px;font-weight:bold;}

/* GALLERY */
.gallery{
padding:40px;background:#e6d5b8;
}
.gallery-container{
display:flex;overflow-x:auto;gap:10px;
}
.gallery-container img{
width:300px;height:200px;
object-fit:cover;border-radius:10px;
}

/* REVIEWS */
.reviews{
padding:40px;background:#fff;
}
.review{
background:#f5f0e6;
padding:15px;
margin:10px 0;
border-left:5px solid #3b2f2f;
}

/* ICONS */
.icons{
display:flex;justify-content:center;
gap:20px;padding:20px;
background:#e6d5b8;font-size:24px;
}
.icons i{color:#3b2f2f;}

/* FOOTER */
footer{
background:#3b2f2f;
color:#f5f0e6;
padding:30px;
text-align:center;
}
footer a{color:#e6d5b8;margin:0 10px;text-decoration:none;}
</style>
</head>

<body>

<header>
<div class="logo">🌍 TravelCo</div>
<div class="menu"><i class="fa fa-bars"></i></div>

<!-- MENU -->
<div class="nav" id="navMenu">
<a href="#booking">Booking</a>
<a href="#reviews">Reviews</a>
<a href="#gallery">Gallery</a>
</div>
</header>

<!-- HERO -->
<section class="hero">
<div class="slide active" style="background-image:url('https://images.unsplash.com/photo-1501785888041-af3ef285b470');">
<div class="hero-text">Explore Africa in Style</div>
</div>

<div class="slide" style="background-image:url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee');">
<div class="hero-text">Amazing Safari Adventures</div>
</div>

<div class="slide" style="background-image:url('https://images.unsplash.com/photo-1446776811953-b23d57bd21aa');">
<div class="hero-text">Discover Wild Nature</div>
</div>
</section>

<!-- COUNTERS -->
<section class="stats">
<div class="stat"><h2 class="count" data-target="1200">0</h2><p>Tourists</p></div>
<div class="stat"><h2 class="count" data-target="80">0</h2><p>Destinations</p></div>
<div class="stat"><h2 class="count" data-target="50">0</h2><p>Hotels</p></div>
</section>

<!-- BOOKING -->
<section class="booking" id="booking">
<h2>Book Your Trip</h2>

<div class="booking-card">
<input type="text" id="name" placeholder="Full Name">
<input type="email" id="email" placeholder="Email">
<input type="tel" id="phone" placeholder="Phone">
<input type="date" id="date">

<select id="destination">
<option value="">Select Destination</option>
<option>Maasai Mara</option>
<option>Serengeti</option>
<option>Queen Elizabeth</option>
<option>Bwindi Forest</option>
</select>

<button onclick="sendBooking()">Book Now</button>
<p id="msg"></p>
</div>
</section>

<!-- GALLERY -->
<section class="gallery" id="gallery">
<h2>Photo Gallery</h2>
<div class="gallery-container">
<img src="https://images.unsplash.com/photo-1527631746610-bca00a040d60">
<img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee">
<img src="https://images.unsplash.com/photo-1493558103817-58b2924bce98">
<img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470">
</div>
</section>

<!-- REVIEWS -->
<section class="reviews" id="reviews">
<h2>Reviews</h2>

<div class="booking-card">
<input type="text" id="revName" placeholder="Your Name">
<textarea id="revText" placeholder="Write review"></textarea>
<button onclick="addReview()">Submit Review</button>
</div>

<div id="reviewsList"></div>
</section>

<!-- ICONS -->
<div class="icons">
<i class="fa-brands fa-cc-visa"></i>
<i class="fa-brands fa-cc-mastercard"></i>
<i class="fa-brands fa-paypal"></i>
<i class="fa-brands fa-facebook"></i>
<i class="fa-brands fa-instagram"></i>
<i class="fa-brands fa-x-twitter"></i>
</div>

<!-- FOOTER -->
<footer>
<p>Contact: +256 770 462 422</p>
<p>
<a href="#">Privacy</a>
<a href="#">Terms</a>
<a href="#">About</a>
</p>
<p>© 2026 TravelCo</p>
</footer>

<!-- SCRIPTS -->

<!-- HERO -->
<script>
let slides=document.querySelectorAll(".slide");
let i=0;
setInterval(()=>{
slides[i].classList.remove("active");
i=(i+1)%slides.length;
slides[i].classList.add("active");
},4000);
</script>

<!-- COUNTERS -->
<script>
document.querySelectorAll(".count").forEach(c=>{
let update=()=>{
let t=+c.getAttribute("data-target");
let n=+c.innerText;
if(n<t){
c.innerText=Math.ceil(n+t/100);
setTimeout(update,30);
}else c.innerText=t;
};
update();
});
</script>

<!-- MENU -->
<script>
document.querySelector(".menu").addEventListener("click",()=>{
let nav=document.getElementById("navMenu");
nav.style.display = nav.style.display==="flex"?"none":"flex";
});
</script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig={
apiKey:"YOUR_API_KEY",
authDomain:"YOUR_PROJECT.firebaseapp.com",
projectId:"YOUR_PROJECT_ID",
storageBucket:"YOUR_PROJECT.appspot.com",
messagingSenderId:"XXXX",
appId:"XXXX"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
</script>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
emailjs.init("YOUR_EMAILJS_PUBLIC_KEY");
</script>

<!-- BOOKING -->
<script>
function sendBooking(){
let name=document.getElementById("name").value;
let email=document.getElementById("email").value;
let phone=document.getElementById("phone").value;
let date=document.getElementById("date").value;
let destination=document.getElementById("destination").value;

if(!name||!email||!phone||!date||!destination){
document.getElementById("msg").innerText="Fill all fields!";
return;
}

db.collection("bookings").add({name,email,phone,date,destination,time:new Date()});

emailjs.send("YOUR_SERVICE_ID","YOUR_TEMPLATE_ID",{name,email,phone,date,destination});

document.getElementById("msg").innerText="Booked successfully!";
}
</script>

<!-- REVIEWS FIREBASE -->
<script>
const reviewsRef=db.collection("reviews");

function addReview(){
let name=document.getElementById("revName").value;
let text=document.getElementById("revText").value;

if(!name||!text)return;

reviewsRef.add({name,text,time:new Date()});

document.getElementById("revName").value="";
document.getElementById("revText").value="";
}

reviewsRef.orderBy("time","desc").onSnapshot(snap=>{
let html="";
snap.forEach(doc=>{
let r=doc.data();
html+=`<div class="review"><strong>${r.name}</strong><br>${r.text}</div>`;
});
document.getElementById("reviewsList").innerHTML=html;
});
</script>

</body>
</html>
